name: House Brain Energy AI
version: "0.1.3"
slug: house_brain_energy_ai
description: Local energy forecasts, evidence and bank-aware shadow planning. No physical
  commands.
arch:
- aarch64
homeassistant: 2026.10.0
startup: application
boot: manual
stage: experimental
init: false
stdin: true
backup: cold
homeassistant_api: true
hassio_api: false
docker_api: false
host_network: false
full_access: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
options:
  setup_only: false
  mode: SHADOW
  publish_status: false
  bindings: []
  backfill: false
schema:
  setup_only: bool
  mode: list(SHADOW|BUILD/REPLAY)
  publish_status: bool
  bindings:
  - entity: str
    role: str
    family: str
    classification: str
    max_age_s: int(60,3600)
  backfill: bool
