name: "House Brain Maintenance"
version: "0.9.16"
slug: "house_brain_maintenance"
description: >-
  Reviews pending App, HACS and device-firmware updates and applies them after your iPhone approval
  (phone unlock required; no answer means no): backup of that App only,
  update, health watch, automatic restore of its backup if it fails. Optional
  night-time automatic install of low-risk bug-fix updates of Apps and HACS
  cards/themes (off by default); HACS integrations and device firmware always ask.
  Also rotates the Inventory Scout key safely and runs the Scout once, and installs
  a new Inspector/Observer/Scout source from a pinned GitHub carrier after one tap. Pinned
  Supervisor route allowlist; Home Assistant Core/OS updates only after your
  approval (full backup first; Core restored automatically if it fails; an OS update
  is installed first and the Pi restarts only after a second Approve, with a
  one-tap rollback to the previous OS);
  never updates the Supervisor or itself;
  no host port (ingress only); no physical control (device firmware is
  installed only after your approval). After an outage it shows
  what happened and what to check (Recovery Report, read-only). Sends Cloudflare
  control approval links to your phone (it approves nothing itself).
arch:
  - aarch64
homeassistant: "2026.8.3"
startup: application
boot: auto
stage: experimental
backup: hot
init: false
apparmor: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
docker_api: false
auth_api: false
full_access: false
host_network: false
host_ipc: false
host_dbus: false
host_pid: false
host_uts: false
stdin: false
usb: false
uart: false
udev: false
gpio: false
devicetree: false
kernel_modules: false
audio: false
video: false
tmpfs: true
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: "mdi:wrench-clock"
panel_title: "Maintenance"
panel_admin: true
# 0.7.4 (owner pop-ups 2026-10-10 "Approve design, build it"): STAGE_LOCAL_APP_SOURCE stages a new local House Brain
# App source (Inspector, Observer, Inventory Scout only) after the owner's Approve. Only the carrier's own script
# writes these folders: one allowlisted App folder in /addons and its backup under /share/hb91-app-update
# (AppArmor narrows both).
map:
  - type: addons
    read_only: false
  - type: share
    read_only: false
# R2 (owner pop-up 2026-10-07 "Allow the temporary port"): the GitHub Connect hand-off address. The App listens on
# it only while a Connect is pending (at most about one hour) and answers only with a valid one-time state.
ports:
  "8097/tcp": 8097
ports_description:
  "8097/tcp": "GitHub Connect hand-off (open only during a Connect)"
options:
  github_repo: "nine95nine/home-assistant-whole-home"
  github_token: null
  github_auth: "auto"
  retire_old_token: true
  relay_credential_url: ""
  requests_branch: "maint/requests"
  notify_service: null
  owner_username: null
  dry_run: true
  poll_seconds: 300
  max_approval_requests_per_day: 4
  approval_timeout_minutes: 15
  require_phone_unlock: true
  scout_slug: "local_house_brain_maintenance_inventory_scout"
  observer_slug: "local_house_brain_engineering_observer"
  clear_freeze_for: ""
  update_mode: "ask"
  update_check_minutes: 60
  auto_window_start_hour: 2
  auto_window_end_hour: 5
  auto_wait_days: 3
  health_check_minutes: 3
  report_issue: 0
  issue_checks: true
  digest_hour: 8
  recovery_report: true
  safety_notify_services: []
  liveness_url: ""
  liveness_key: ""
  liveness_interval_minutes: 2
  extender_plug_entity: "switch.iaqualink_wifi_plug_socket_1"
  update_reask_hours: 6
  entity_updates: true
  firmware_wait_days: 30
  update_hold: []
  hold_core_dot_zero: true
  after_update_minutes: 10
  undo_hours: 24
  key_rotation: true
  key_rotate_days: 90
  keep_old_deployer: true
  cf_control_issue: 454
  cf_control_url: ""
  upgrade_checks: true
  backup_report: true
  pi_health: true
  pi_firmware_updates: true
  housekeeping: true
  ai_review: true
schema:
  github_repo: "match(^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$)"
  github_token: password?
  github_auth: "list(auto|github_app|pat)"
  retire_old_token: "bool?"
  relay_credential_url: "match(^(off|https://[a-z0-9-]{1,63}\\.[a-z0-9-]{1,63}\\.workers\\.dev/v1/dispatch-credential)?$)?"
  requests_branch: "match(^[A-Za-z0-9._/-]{1,100}$)"
  notify_service: "match(^mobile_app_[a-z0-9_]{1,80}$)"
  owner_username: "match(^[A-Za-z0-9_.@-]{1,64}$)"
  dry_run: bool
  poll_seconds: "int(60,3600)"
  max_approval_requests_per_day: "int(1,12)"
  approval_timeout_minutes: "int(2,60)"
  require_phone_unlock: bool
  scout_slug: "match(^[a-z0-9][a-z0-9_]{0,99}$)"
  observer_slug: "match(^[a-z0-9][a-z0-9_]{0,99}$)"
  clear_freeze_for: "match(^([a-z0-9][a-z0-9-]{2,63})?$)?"
  update_mode: "list(ask|auto_low_risk)"
  update_check_minutes: "int(15,1440)"
  auto_window_start_hour: "int(0,23)"
  auto_window_end_hour: "int(0,23)"
  auto_wait_days: "int(0,30)"
  health_check_minutes: "int(1,30)"
  report_issue: "int(0,10000000)"
  issue_checks: bool
  digest_hour: "int(0,23)"
  recovery_report: bool
  safety_notify_services:
    - "match(^mobile_app_[a-z0-9_]{1,80}$)?"
  liveness_url: "match(^(https://[a-z0-9-]{1,63}\\.[a-z0-9-]{1,63}\\.workers\\.dev/v1/ping)?$)?"
  liveness_key: password?
  liveness_interval_minutes: "int(2,30)"
  extender_plug_entity: "match(^(switch\\.[a-z0-9_]{1,80})?$)?"
  update_reask_hours: "int(1,48)"
  entity_updates: "bool?"
  firmware_wait_days: "int(0,90)?"
  hold_core_dot_zero: "bool?"
  after_update_minutes: "int(0,120)?"
  undo_hours: "int(1,72)?"
  key_rotation: "bool?"
  key_rotate_days: "int(30,365)?"
  keep_old_deployer: "bool?"
  cf_control_issue: "int(0,10000000)?"
  upgrade_checks: "bool?"
  backup_report: "bool?"
  pi_health: "bool?"
  pi_firmware_updates: "bool?"
  housekeeping: "bool?"
  ai_review: "bool?"
  cf_control_url: "match(^(https://house-brain-cloudflare-control\\.[a-z0-9-]{1,63}\\.workers\\.dev)?$)?"
  update_hold:
    - "match(^update\\.[a-z0-9_]{1,200}$)?"
