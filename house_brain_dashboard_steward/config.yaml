name: House Brain Dashboard Steward
version: "0.1.0"
slug: house_brain_dashboard_steward
description: Read-only dashboard specialist. Audits dashboards, notices new and renamed devices, and drafts
  owner-reviewed Lovelace YAML with a local model; no dashboard writes, no commands, no state writes.
arch:
- aarch64
homeassistant: 2026.10.0
startup: application
boot: manual
stage: experimental
init: false
homeassistant_api: true
hassio_api: false
docker_api: false
host_network: false
full_access: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-edit
options:
  model_url: ""
  model_name: ""
  model_calls_per_day: 48
  generation_targets: []
schema:
  model_url: str?
  model_name: str?
  model_calls_per_day: int(0,200)
  generation_targets:
  - match(^[a-z0-9][a-z0-9_-]{0,62}$)?
